# Info
info.application.name=@project.name@
info.application.artifactId=@project.artifactId@
info.application.version=@project.version@
info.application.description=@project.description@
info.properties.environment=local

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Openapi
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Server
server.servlet.context-path=/
server.port=8080

# Logging
logging.level.root=INFO
logging.level.it.gov.pagopa=DEBUG

# CORS configuration
cors.configuration={"origins": ["*"], "methods": ["*"]}

# Jackson serialization
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=secret

# GPD client
service.gpd.host=https://weudev.gps.internal.dev.platform.pagopa.it/pagopa-gpd-core
retry.gpd.maxAttempts=3
retry.gpd.maxDelay=2000

# Api Config Cache client
apiConfigCacheClient.url=http://localhost:9091
apiConfigCacheClient.ocpSubKey=mock-local-key

# consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
kafka.topic.nodo-dei-pagamenti-cache=nodo-dei-pagamenti-cache
kafka.consumer.group-id=pagopa-gps-mbd-service-cache-group
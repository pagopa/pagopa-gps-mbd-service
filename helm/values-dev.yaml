microservice-chart:
  namespace: "ebollo"
  nameOverride: ""
  fullnameOverride: "pagopa-gps-mbd-service"
  image:
    repository: ghcr.io/pagopa/pagopa-gps-mbd-service
    tag: "1.2.6-32-feature_PAGOPA-3720-mbd-payment-option"
    pullPolicy: Always
  livenessProbe:
    handlerType: httpGet
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 90
    failureThreshold: 6
    periodSeconds: 10
  readinessProbe:
    handlerType: httpGet
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 90
    failureThreshold: 6
    periodSeconds: 10
  deployment:
    create: true
  service:
    create: true
    type: ClusterIP
    ports:
      - 8080
  ingress:
    create: true
    host: "ebollo.itn.internal.dev.platform.pagopa.it"
    path: /pagopa-gps-mbd-service/(.*)
    servicePort: 8080
  serviceAccount:
    name: "ebollo-workload-identity"
  azure:
    workloadIdentityClientId: <workload-identity-client-id-set-automatically-by-gha>
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - all
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.25"
    limits:
      memory: "768Mi"
      cpu: "0.5"
  autoscaling:
    enable: true
    minReplica: 1
    maxReplica: 1
    pollingInterval: 10 # seconds
    cooldownPeriod: 60 # seconds
    triggers:
      - type: cpu
        metadata:
          type: Utilization
          value: "75"
      - type: memory
        metadata:
          type: Utilization
          value: "70"
  envConfig:
    APP_NAME: "pagopa-gps-mbd-service"
    APP_ENVIRONMENT: "dev"
    WEBSITE_SITE_NAME: "pagopa-gps-mbd-service"
    ENV: "azure-dev"
    APP_LOGGING_LEVEL: "INFO"
    DEFAULT_LOGGING_LEVEL: "INFO"
    CORS_CONFIGURATION: '{"origins": ["*"], "methods": ["*"]}'
    OTEL_SERVICE_NAME: "pagopa-gps-mbd-service"
    OTEL_SERVICE_ENVIRONMENT: "dev"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.otel.svc:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
    APICONFIG_CACHE_URL: "https://api.dev.platform.pagopa.it/api-config-cache/p/v1"
    CACHE_EVT_HOST: "pagopa-d-weu-core-evh-ns04.servicebus.windows.net:9093"
    CACHE_EVT_TOPIC: "nodo-dei-pagamenti-cache"
    KAFKA_CONSUMER_GROUP_ID: "pagopa-gps-mbd-service-cache-group"
    KAFKA_CONFIG_SECURITY_PROTOCOL: "SASL_SSL"
    KAFKA_CONFIG_SASL_MECHANISM: "PLAIN"
    GPD_HOST: "https://weudev.gps.internal.dev.platform.pagopa.it/pagopa-gpd-core"
    REDIS_HOST: "pagopa-d-redis.redis.cache.windows.net"
    REDIS_PORT: "6380"
    REDIS_SSL: "true"
  envSecret:
    APPLICATIONINSIGHTS_CONNECTION_STRING: "app-insight-connection-string"
    APICONFIG_SUBKEY: "apiconfig-cache-subkey"
    KAFKA_EH_CACHE_JAAS_CONFIG: "evh-cache-jaas-config"
    REDIS_PASSWORD: "redis-password"
  keyvault:
    name: "pagopa-d-itn-ebollo-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node_type
                operator: In
                values:
                  - user
  canaryDelivery:
    create: false
    ingress:
      create: false
    service:
      create: false
    deployment:
      create: false
